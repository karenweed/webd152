<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacific Trails Resort :: Reservations</title>
  <link rel="stylesheet" href="pacific.css">
</head>
<body>
  <div id="wrapper">
    <header><h1>Pacific Trails Resort</h1></header>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="yurts.html">Yurts</a></li>
        <li><a href="activities.html">Activities</a></li>
        <li><a href="reservations.html">Reservations</a></li>
      </ul>
    </nav>
    
    <div id="reservationshero"></div>

    <main>
      <div class="center">
        <h2>Reservations at Pacific Trails</h2>
        <h3>Contact Us Today!</h3>
        <p>Required fields are marked with an asterisk *.</p>
      </div>

      <form method="post" action="https://webdevbasics.net/scripts/reservation.php" autocomplete="on" novalidate>
        <label for="myFName">*First Name:</label>
        <input type="text" id="myFName" name="myFName" required aria-required="true" autocomplete="given-name" />

        <label for="myLName">*Last Name:</label>
        <input type="text" id="myLName" name="myLName" required aria-required="true" autocomplete="family-name" />

        <label for="myEmail">*E-mail:</label>
        <input type="email" id="myEmail" name="myEmail" required aria-required="true" autocomplete="email" />

        <label for="myPhone">Phone:</label>
        <input type="tel" id="myPhone" name="myPhone" maxlength="12" autocomplete="tel" />

        <label for="myArrival">Arrival Date:</label>
        <input type="date" id="myArrival" name="myArrival" autocomplete="off" />

        <label for="myNights">Nights:</label>
        <input type="number" id="myNights" name="myNights" min="1" max="14" autocomplete="off" />

        <label for="myComments">Comments:</label>
        <textarea id="myComments" name="myComments" rows="2" cols="30" required aria-required="true" autocomplete="off"></textarea>

        <input type="submit" value="Submit" />
      </form>

      <h2>Reservations</h2>
      <p>Call us at <a href="tel:888-555-1212">888-555-1212</a> to reserve your stay.</p>
    </main>

    <footer>
      <p>
        Copyright &copy; 2026 Pacific Trails Resort
        <a href="mailto:ksiordia@student.sdccd.edu">Karen Weed</a>
      </p>
    </footer>
  </div>
</body>
</html>
